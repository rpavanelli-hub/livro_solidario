services:
  postgres:
    image: postgres:16-alpine
    container_name: livro-solidario-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usuario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha}
      POSTGRES_DB: ${POSTGRES_DB:-livro_solidario}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usuario}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - livro-solidario-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livro-solidario-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-usuario}:${POSTGRES_PASSWORD:-senha}@postgres:5432/${POSTGRES_DB:-livro_solidario}
      JWT_SECRET: ${JWT_SECRET:-alterar-este-segredo-em-producao}
      PORT: 3000
      FRONTEND_URL: http://localhost
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - livro-solidario-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: livro-solidario-web
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - livro-solidario-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  livro-solidario-network:
    driver: bridge
